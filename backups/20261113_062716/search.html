<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#B8543D">
  <title>Rechercher — KWATTA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            terra: { 50:'#fdf5f2',100:'#fbe8e2',200:'#f5d0c5',300:'#ecad9b',400:'#d97a63',500:'#B8543D',600:'#a3442f',700:'#873727',800:'#6e2f23',900:'#5a2a20' },
            cream: '#FAF6F0',
            charcoal: '#2D2A26',
            honey: '#E8A96A',
          },
          fontFamily: {
            display: ['"Space Grotesk"', 'system-ui', 'sans-serif'],
            body: ['Inter', 'system-ui', 'sans-serif'],
          },
        }
      }
    }
  </script>

  <link rel="stylesheet" href="css/styles.css">

<body class="bg-cream text-charcoal font-body antialiased">

  <!-- HEADER -->
  <header class="sticky top-0 z-40 bg-cream/95 backdrop-blur border-b border-charcoal/5">
    <div class="max-w-7xl mx-auto px-4 py-3">
      <div class="flex items-center gap-3">

          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
        </a>
        <div class="flex-1 relative">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-charcoal/40" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <input type="text" id="search-input" placeholder="Rechercher..." autofocus
            class="w-full pl-10 pr-4 py-2.5 bg-white border border-charcoal/10 rounded-xl text-sm focus:border-terra-500 outline-none">
        </div>
        <button id="filter-toggle" class="w-9 h-9 rounded-lg hover:bg-charcoal/5 flex items-center justify-center shrink-0 relative">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M3 6h18M6 12h12M10 18h4"/>
          </svg>
          <span id="filter-count" class="hidden absolute -top-0.5 -right-0.5 w-4 h-4 rounded-full bg-terra-500 text-white text-[10px] font-bold flex items-center justify-center">0</span>
        </button>
      </div>
    <button id="lang-toggle" class="w-9 h-9 rounded-lg hover:bg-charcoal/5 flex items-center justify-center text-xs font-bold" title="FR / EN" onclick="if(window.kwattaToggleLang) window.kwattaToggleLang()">
        <span id="current-lang">EN</span>
      </button>
      </div>
    
  </header>

  <!-- FILTRES AVANCÉS -->
  <div id="filters-panel" class="hidden bg-white border-b border-charcoal/5">
    <div class="max-w-7xl mx-auto px-4 py-5 space-y-5 max-h-[70vh] overflow-y-auto">

      <!-- Barre d'actions -->
      <div class="flex items-center justify-between pb-3 border-b border-charcoal/5">

      </div>

      <!-- Prix -->

        <div class="flex items-center gap-3">
          <input type="number" id="price-min" placeholder="Min"

        </div>
      </div>

      <!-- État -->

        <label class="block text-xs font-mono uppercase text-charcoal/50 mb-2">État</label>
        <div class="flex flex-wrap gap-2">
          <button class="filter-pill" data-condition="neuf_avec_etiquette">✨ Neuf avec étiquette</button>

          <button class="filter-pill" data-condition="bon_etat">👍 Bon état</button>

        <div class="relative">

        </div>

      </div>

      <!-- Taille -->
      <div>
        <label class="block text-xs font-mono uppercase text-charcoal/50 mb-2">Taille</label>
        <div class="flex flex-wrap gap-2">
          <button class="filter-pill size-pill" data-size="XS">XS</button>
          <button class="filter-pill size-pill" data-size="S">S</button>
          <button class="filter-pill size-pill" data-size="M">M</button>
          <button class="filter-pill size-pill" data-size="L">L</button>
          <button class="filter-pill size-pill" data-size="XL">XL</button>
          <button class="filter-pill size-pill" data-size="XXL">XXL</button>
          <button class="filter-pill size-pill" data-size="36">36</button>
          <button class="filter-pill size-pill" data-size="38">38</button>
          <button class="filter-pill size-pill" data-size="40">40</button>
          <button class="filter-pill size-pill" data-size="42">42</button>
          <button class="filter-pill size-pill" data-size="44">44</button>
        </div>
      </div>

      <!-- Couleur -->
      <div>
        <label class="block text-xs font-mono uppercase text-charcoal/50 mb-2">Couleur</label>
        <div class="flex flex-wrap gap-2">
          <button class="color-pill" data-color="Noir" title="Noir">
            <span style="background:#000"></span>
          </button>
          <button class="color-pill" data-color="Blanc" title="Blanc">
            <span style="background:#fff;border:1px solid #ddd"></span>
          </button>
          <button class="color-pill" data-color="Gris" title="Gris">
            <span style="background:#9CA3AF"></span>
          </button>
          <button class="color-pill" data-color="Beige" title="Beige">
            <span style="background:#F5F5DC"></span>
          </button>
          <button class="color-pill" data-color="Marron" title="Marron">
            <span style="background:#92400E"></span>
          </button>
          <button class="color-pill" data-color="Rouge" title="Rouge">
            <span style="background:#DC2626"></span>
          </button>
          <button class="color-pill" data-color="Rose" title="Rose">
            <span style="background:#EC4899"></span>
          </button>
          <button class="color-pill" data-color="Orange" title="Orange">
            <span style="background:#F97316"></span>
          </button>
          <button class="color-pill" data-color="Jaune" title="Jaune">
            <span style="background:#FBBF24"></span>
          </button>
          <button class="color-pill" data-color="Vert" title="Vert">
            <span style="background:#10B981"></span>
          </button>
          <button class="color-pill" data-color="Bleu" title="Bleu">
            <span style="background:#3B82F6"></span>
          </button>
          <button class="color-pill" data-color="Violet" title="Violet">
            <span style="background:#8B5CF6"></span>
          </button>
          <button class="color-pill" data-color="Multicolore" title="Multicolore">
            <span style="background:linear-gradient(45deg, #DC2626, #FBBF24, #10B981, #3B82F6)"></span>

      </div>

      <!-- Matière -->
      <div>
        <label class="block text-xs font-mono uppercase text-charcoal/50 mb-2">Matière</label>
        <select id="matiere-select" class="w-full px-3 py-2 bg-cream border border-charcoal/10 rounded-lg text-sm focus:border-terra-500 outline-none">
          <option value="">Toutes les matières</option>
          <option value="Coton">Coton</option>
          <option value="Lin">Lin</option>
          <option value="Soie">Soie</option>
          <option value="Laine">Laine</option>
          <option value="Cachemire">Cachemire</option>
          <option value="Polyester">Polyester</option>
          <option value="Cuir">Cuir</option>
          <option value="Daim">Daim</option>
          <option value="Jean">Jean / Denim</option>
          <option value="Velours">Velours</option>
          <option value="Satin">Satin</option>
          <option value="Wax">Wax / Pagne</option>

      <!-- Style -->
      <div>
        <label class="block text-xs font-mono uppercase text-charcoal/50 mb-2">Style</label>
        <div class="flex flex-wrap gap-2">
          <button class="filter-pill style-pill" data-style="Casual">Casual</button>
          <button class="filter-pill style-pill" data-style="Sport">Sport</button>
          <button class="filter-pill style-pill" data-style="Chic">Chic</button>
          <button class="filter-pill style-pill" data-style="Vintage">Vintage</button>
          <button class="filter-pill style-pill" data-style="Bohème">Bohème</button>
          <button class="filter-pill style-pill" data-style="Streetwear">Streetwear</button>
          <button class="filter-pill style-pill" data-style="Formel">Formel</button>

      <!-- Ville -->

        <select id="city-input" class="w-full px-3 py-2 bg-cream border border-charcoal/10 rounded-lg text-sm focus:border-terra-500 outline-none">

      <!-- Actions -->

        <button id="apply-filters" class="flex-1 py-3 rounded-xl bg-terra-500 hover:bg-terra-600 text-cream font-semibold transition">

  </div>

  <!-- BARRE DES FILTRES ACTIFS -->
  <div id="active-filters" class="hidden max-w-7xl mx-auto px-4 pt-3">
    <div class="flex flex-wrap items-center gap-2">
      <span class="text-xs text-charcoal/50 font-semibold">Filtres actifs :</span>
      <div id="active-filters-list" class="flex flex-wrap gap-2"></div>
    </div>
  </div>

  <!-- TRI -->
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
    <div id="results-count" class="text-sm text-charcoal/60">—</div>
    <select id="sort-select" class="px-3 py-1.5 bg-white border border-charcoal/10 rounded-lg text-sm focus:border-terra-500 outline-none">
      <option value="recent">Plus récents</option>
      <option value="price_asc">Prix croissant</option>
      <option value="price_desc">Prix décroissant</option>
    </select>
  </div>

  <!-- RÉSULTATS -->
  <main class="max-w-7xl mx-auto px-4 pb-24 sm:pb-8">
    <div id="products-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3"></div>
    <div id="empty-state" class="hidden text-center py-16">
      <div class="text-6xl mb-3">🔍</div>
      <p class="text-charcoal/60">Aucun article trouvé</p>
      <p class="text-sm text-charcoal/40 mt-1">Essayez d'autres critères</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-init.js"></script>
  <script src="js/verified-badge.js"></script>
  <script>

    // ============================================
    // UTILITAIRES
    // ============================================
    const $ = (id) => document.getElementById(id);
    window.$ = $;
    // ============================================
    // ÉTAT DES FILTRES
    // ============================================
    let filters = {
      q: '',
      category_id: null,
      price_min: null,
      price_max: null,
      condition: null,
      brands: [],           // Liste de marques (multi)
      sizes: [],            // Liste de tailles (multi)
      couleurs: [],         // Liste de couleurs (multi)
      matiere: null,
      styles: [],           // Liste de styles (multi)
      city: '',
      sort: 'recent',
      // Nouveaux tris
      sort_options: {
        'recent': { label: 'Plus récents', col: 'created_at', asc: false },
        'price_asc': { label: 'Prix croissant', col: 'price_xaf', asc: true },
        'price_desc': { label: 'Prix décroissant', col: 'price_xaf', asc: false },
        'popular': { label: 'Plus populaires', col: 'vues', asc: false },
        'favoris': { label: 'Plus aimés', col: 'favoris_count', asc: false }
      }
    };

    function formatPrice(p) {
      return new Intl.NumberFormat('fr-FR').format(p) + ' FCFA';
    }

    // ============================================
    // RECHERCHE
    // ============================================
    async function search() {
      const grid = $('products-grid');
      grid.innerHTML = Array(6).fill('<div class="skeleton-card"></div>').join('');
      $('empty-state').classList.add('hidden');

      let query = window.kwatta_db
        .from('listings')
        .select('*, seller:profiles!listings_seller_id_fkey(is_verified)')
        .eq('status', 'published');

      if (filters.q) {
        query = query.or(`title.ilike.%${filters.q}%,description.ilike.%${filters.q}%,brand.ilike.%${filters.q}%`);
      }
      if (filters.category_id) {
        query = query.eq('category_id', filters.category_id);
      }
      if (filters.price_min !== null) query = query.gte('price_xaf', filters.price_min);
      if (filters.price_max !== null) query = query.lte('price_xaf', filters.price_max);
      if (filters.condition) query = query.eq('condition', filters.condition);
      if (filters.city) query = query.ilike('location_city', `%${filters.city}%`);
      
      // Multi-sélection
      if (filters.brands.length > 0) {
        query = query.in('brand', filters.brands);
      }
      if (filters.sizes.length > 0) {
        query = query.in('size', filters.sizes);
      }
      if (filters.couleurs.length > 0) {
        query = query.in('couleur', filters.couleurs);
      }
      if (filters.matiere) {
        query = query.eq('matiere', filters.matiere);
      }
      if (filters.styles.length > 0) {
        query = query.in('style', filters.styles);
      }

      // Tri
      const sortOpt = filters.sort_options[filters.sort] || filters.sort_options.recent;
      query = query.order(sortOpt.col, { ascending: sortOpt.asc });

      const { data, error } = await query.limit(100);

      if (error) { 
        console.error(error); 
        $('results-count').textContent = 'Erreur de chargement';
        return; 
      }

      const list = data || [];
      $('results-count').textContent = list.length + ' résultat' + (list.length > 1 ? 's' : '');

      if (list.length === 0) {
        grid.innerHTML = '';
        $('empty-state').classList.remove('hidden');
        return;
      }

      grid.innerHTML = list.map(p => {
        const img = (p.images && p.images[0]) || 'https://placehold.co/400x500/f5f3ee/2D2A26?text=KWATTA';
        const brandHtml = p.brand ? '<div class="product-brand">' + p.brand + '</div>' : '';
        const sizeHtml = p.size ? '<span class="product-size">Taille ' + p.size + '</span>' : '';
        const couleurDot = p.couleur ? '<span class="w-3 h-3 rounded-full inline-block ml-1" style="background:' + getColorHex(p.couleur) + ';border:1px solid rgba(0,0,0,0.1);"></span>' : '';
        
        return `
          <div class="product-card" onclick="window.location.href='product.html?id=${p.id}'">
            <div class="product-image-wrap">
              <img src="${img}" class="product-image" loading="lazy">
            </div>
            <div class="product-info">
              ${brandHtml}
              <div class="product-title">${p.title}${window.renderVerifiedBadge ? window.renderVerifiedBadge(p.seller?.is_verified, 'sm') : ''}</div>
              <div class="product-meta">
                <span class="product-price">${formatPrice(p.price_xaf)}</span>
                ${sizeHtml}${couleurDot}
              </div>
            </div>
          </div>
        `;
      }).join('');

      renderActiveFilters();
    }

    // Map couleurs → hex
    function getColorHex(couleur) {
      const map = {
        'Noir': '#000000',
        'Blanc': '#FFFFFF',
        'Gris': '#9CA3AF',
        'Beige': '#F5F5DC',
        'Marron': '#92400E',
        'Rouge': '#DC2626',
        'Rose': '#EC4899',
        'Orange': '#F97316',
        'Jaune': '#FBBF24',
        'Vert': '#10B981',
        'Bleu': '#3B82F6',
        'Violet': '#8B5CF6',
        'Multicolore': 'linear-gradient(45deg, #DC2626, #FBBF24, #10B981, #3B82F6)'
      };
      return map[couleur] || '#CCCCCC';
    }

    // ============================================
    // RENDER : FILTRES ACTIFS
    // ============================================
    function renderActiveFilters() {
      const container = $('active-filters');
      const list = $('active-filters-list');
      
      const tags = [];
      
      if (filters.price_min !== null) tags.push({ label: 'Min ' + formatPrice(filters.price_min), key: 'price_min' });
      if (filters.price_max !== null) tags.push({ label: 'Max ' + formatPrice(filters.price_max), key: 'price_max' });
      if (filters.condition) tags.push({ label: filters.condition, key: 'condition' });
      if (filters.city) tags.push({ label: '📍 ' + filters.city, key: 'city' });
      if (filters.matiere) tags.push({ label: filters.matiere, key: 'matiere' });
      
      filters.brands.forEach(b => tags.push({ label: '🏷️ ' + b, key: 'brand', value: b }));
      filters.sizes.forEach(s => tags.push({ label: '📏 ' + s, key: 'size', value: s }));
      filters.couleurs.forEach(c => tags.push({ label: '🎨 ' + c, key: 'couleur', value: c }));
      filters.styles.forEach(s => tags.push({ label: '✨ ' + s, key: 'style', value: s }));
      
      if (tags.length === 0) {
        container.classList.add('hidden');
        return;
      }
      
      container.classList.remove('hidden');
      list.innerHTML = tags.map(t => `
        <span class="active-filter-tag">
          ${t.label}
          <button onclick="removeFilter('${t.key}', '${t.value || ''}')">×</button>
        </span>
      `).join('');
    }

    // Retire un filtre
    window.removeFilter = (key, value) => {
      if (key === 'brand') {
        filters.brands = filters.brands.filter(b => b !== value);
        renderBrandTags();
      } else if (key === 'size') {
        filters.sizes = filters.sizes.filter(s => s !== value);
        document.querySelectorAll('.size-pill').forEach(p => {
          if (p.dataset.size === value) p.classList.remove('active');
        });
      } else if (key === 'couleur') {
        filters.couleurs = filters.couleurs.filter(c => c !== value);
        document.querySelectorAll('.color-pill').forEach(p => {
          if (p.dataset.color === value) p.classList.remove('active');
        });
      } else if (key === 'style') {
        filters.styles = filters.styles.filter(s => s !== value);
        document.querySelectorAll('.style-pill').forEach(p => {
          if (p.dataset.style === value) p.classList.remove('active');
        });
      } else {
        filters[key] = null;
      }
      
      search();
    };

    // ============================================
    // ÉVÉNEMENTS : RECHERCHE
    // ============================================
    let searchTimeout;
    $('search-input').addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        filters.q = e.target.value.trim();
        search();
      }, 300);
    });

    // ============================================
    // ÉVÉNEMENTS : PANNEAU
    // ============================================
    $('filter-toggle').addEventListener('click', () => {
      $('filters-panel').classList.toggle('hidden');
    });

    // Reset
    $('reset-filters').addEventListener('click', () => {
      filters = {
        q: filters.q,
        category_id: null,
        price_min: null,
        price_max: null,
        condition: null,
        brands: [],
        sizes: [],
        couleurs: [],
        matiere: null,
        styles: [],
        city: '',
        sort: 'recent',
        sort_options: filters.sort_options
      };
      
      $('price-min').value = '';
      $('price-max').value = '';
      if ($('city-input')) $('city-input').value = '';
      $('matiere-select').value = '';
      $('brand-input').value = '';
      
      document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.color-pill').forEach(p => p.classList.remove('active'));
      
      renderBrandTags();
      updateFilterCount();
      search();
    });

    // Appliquer
    $('apply-filters').addEventListener('click', () => {
      filters.price_min = $('price-min').value ? parseInt($('price-min').value) : null;
      filters.price_max = $('price-max').value ? parseInt($('price-max').value) : null;
      filters.city = $('city-input').value || '';
      filters.matiere = $('matiere-select').value || null;
      
      updateFilterCount();
      search();
      $('filters-panel').classList.add('hidden');
    });

    // ============================================
    // ÉVÉNEMENTS : ÉTAT
    // ============================================
    document.querySelectorAll('.filter-pill:not(.size-pill):not(.style-pill)').forEach(pill => {
      pill.addEventListener('click', () => {
        if (filters.condition === pill.dataset.condition) {
          filters.condition = null;
          pill.classList.remove('active');
        } else {
          document.querySelectorAll('.filter-pill:not(.size-pill):not(.style-pill)').forEach(p => p.classList.remove('active'));
          filters.condition = pill.dataset.condition;
          pill.classList.add('active');
        }
      });
    });

    // ============================================
    // ÉVÉNEMENTS : TAILLE (multi)
    // ============================================
    document.querySelectorAll('.size-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        const size = pill.dataset.size;
        if (filters.sizes.includes(size)) {
          filters.sizes = filters.sizes.filter(s => s !== size);
          pill.classList.remove('active');
        } else {
          filters.sizes.push(size);
          pill.classList.add('active');
        }
        updateFilterCount();
      });
    });

    // ============================================
    // ÉVÉNEMENTS : COULEUR (multi)
    // ============================================
    document.querySelectorAll('.color-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        const couleur = pill.dataset.color;
        if (filters.couleurs.includes(couleur)) {
          filters.couleurs = filters.couleurs.filter(c => c !== couleur);
          pill.classList.remove('active');
        } else {
          filters.couleurs.push(couleur);
          pill.classList.add('active');
        }
        updateFilterCount();
      });
    });

    // ============================================
    // ÉVÉNEMENTS : STYLE (multi)
    // ============================================
    document.querySelectorAll('.style-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        const style = pill.dataset.style;
        if (filters.styles.includes(style)) {
          filters.styles = filters.styles.filter(s => s !== style);
          pill.classList.remove('active');
        } else {
          filters.styles.push(style);
          pill.classList.add('active');
        }
        updateFilterCount();
      });
    });

    // ============================================
    // MARQUES : autocomplete
    // ============================================
    let allBrands = [];
    
    (async () => {
      const { data } = await window.kwatta_db.from('v_top_marques').select('*');
      allBrands = (data || []).map(b => b.brand);
    })();

    $('brand-input').addEventListener('input', (e) => {
      const query = e.target.value.trim().toLowerCase();
      const suggestions = $('brand-suggestions');
      
      if (query.length === 0) {
        suggestions.classList.add('hidden');
        return;
      }
      
      const matches = allBrands.filter(b => 
        b.toLowerCase().includes(query) && !filters.brands.includes(b)
      ).slice(0, 10);
      
      if (matches.length === 0) {
        suggestions.innerHTML = '<div class="px-3 py-2 text-sm text-charcoal/50">Aucune marque</div>';
      } else {
        suggestions.innerHTML = matches.map(b => `
          <button type="button" onclick="addBrand('${b.replace(/'/g, "\'")}')"
            class="w-full text-left px-3 py-2 hover:bg-terra-50 text-sm transition">
            ${b}
          </button>
        `).join('');
      }
      suggestions.classList.remove('hidden');
    });

    $('brand-input').addEventListener('blur', () => {
      setTimeout(() => $('brand-suggestions').classList.add('hidden'), 200);
    });

    window.addBrand = (brand) => {
      if (!filters.brands.includes(brand)) {
        filters.brands.push(brand);
        renderBrandTags();
      }
      $('brand-input').value = '';
      $('brand-suggestions').classList.add('hidden');
      updateFilterCount();
    };

    function renderBrandTags() {
      $('brand-tags').innerHTML = filters.brands.map(b => `
        <span class="brand-tag">
          ${b}
          <button onclick="removeBrand('${b.replace(/'/g, "\'")}')">×</button>
        </span>
      `).join('');
    }

    window.removeBrand = (brand) => {
      filters.brands = filters.brands.filter(b => b !== brand);
      renderBrandTags();
      updateFilterCount();
    };

    // ============================================
    // TRI
    // ============================================
    $('sort-select').innerHTML = Object.entries(filters.sort_options).map(([key, opt]) => 
      `<option value="${key}">${opt.label}</option>`
    ).join('');

    $('sort-select').addEventListener('change', (e) => {
      filters.sort = e.target.value;
      search();
    });

    // ============================================
    // COMPTEUR FILTRES ACTIFS
    // ============================================
    function updateFilterCount() {
      let count = 0;
      if (filters.price_min !== null || filters.price_max !== null) count++;
      if (filters.condition) count++;
      if (filters.city) count++;
      if (filters.matiere) count++;
      count += filters.brands.length;
      count += filters.sizes.length;
      count += filters.couleurs.length;
      count += filters.styles.length;
      
      const badge = $('filter-count');
      if (count > 0) {
        badge.textContent = count;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    // ============================================
    // INIT
    // ============================================
    // Récupère les params URL
    const urlParams = new URLSearchParams(window.location.search);
    const urlQ = urlParams.get('q');
    const urlCat = urlParams.get('cat');

    if (urlQ) {
      $('search-input').value = urlQ;
      filters.q = urlQ;
    }

    if (urlCat) {
      // Charge l'ID de la catégorie depuis le slug
      (async () => {
        const { data } = await window.kwatta_db
          .from('categories')
          .select('id')
          .eq('slug', urlCat)
          .single();
        if (data) {
          filters.category_id = data.id;
          search();
        }
      })();
    } else {
      search();
    }
</script>
  <script src="js/bottom-nav.js" defer></script>
</body>
</html>
