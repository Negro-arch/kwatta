<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#B8543D">
  <title>Boosts — Admin KWATTA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>

  <div class="admin-shell">
    <aside id="admin-sidebar" class="admin-sidebar"></aside>

    <main class="admin-content">

      <div class="admin-header">
        <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap;">
          <div>
            <h1 class="admin-title">🚀 Boosts</h1>
            <p class="admin-subtitle" id="boosts-count">Chargement...</p>
          </div>
        </div>
      </div>

      <div class="admin-section" style="padding:16px;">
        <div style="display:flex; gap:12px; flex-wrap:wrap;">
          <select id="filter-statut" class="admin-input" style="width:auto;">
            <option value="en_attente" selected>⏳ En attente</option>
            <option value="approuve">✅ Approuvées</option>
            <option value="refuse">❌ Refusées</option>
            <option value="">Toutes</option>
          </select>
        </div>
      </div>

      <div id="loading" style="text-align:center; padding:60px 0;">
        <div class="admin-loading"></div>
      </div>

      <div id="boosts-list" class="hidden"></div>

      <div id="empty" class="hidden admin-empty">
        <div class="admin-empty-icon">🚀</div>
        <div class="admin-empty-text">Aucune demande de boost</div>
      </div>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase-init.js"></script>
  <script src="/admin/js/admin.js"></script>

  <script>
    const $ = (id) => document.getElementById(id);
    let allBoosts = [];
    const U = () => window.AdminUtils;

    (async () => {
      const auth = await U().requireAdmin();
      if (!auth) return;
      U().renderSidebar('boosts', auth.profile);
      U().loadSidebarBadges();
      await loadBoosts();
      $('loading').classList.add('hidden');
      $('boosts-list').classList.remove('hidden');
    })();

    async function loadBoosts() {
      const statut = $('filter-statut').value;
      let q = window.kwatta_db
        .from('boost_requests')
        .select('*, listings(id, title, price_xaf, images, status), profiles!boost_requests_user_id_fkey(username, display_name, avatar_url)')
        .order('created_at', { ascending: false });

      if (statut) q = q.eq('statut', statut);

      const { data, error } = await q;
      if (error) {
        console.error('[BOOSTS]', error);
        $('boosts-count').textContent = 'Erreur de chargement';
        return;
      }
      allBoosts = data || [];
      renderBoosts();
    }

    function renderBoosts() {
      $('boosts-count').textContent = allBoosts.length + ' demande' + (allBoosts.length > 1 ? 's' : '');

      if (allBoosts.length === 0) {
        $('boosts-list').innerHTML = '';
        $('empty').classList.remove('hidden');
        return;
      }
      $('empty').classList.add('hidden');

      const statusMap = {
        'en_attente': { cls: 'badge-yellow', txt: '⏳ En attente' },
        'approuve':   { cls: 'badge-green',  txt: '✅ Approuvé' },
        'refuse':     { cls: 'badge-red',    txt: '❌ Refusé' },
        'annule':     { cls: 'badge-gray',   txt: 'Annulé' },
      };

      $('boosts-list').innerHTML = allBoosts.map(b => {
        const s = statusMap[b.statut] || { cls: 'badge-gray', txt: b.statut };
        const listing = b.listings || {};
        const user = b.profiles || {};
        const img = (listing.images && listing.images[0]) || 'https://placehold.co/100x100/f5f3ee/2D2A26?text=K';
        const userName = user.display_name || user.username || '?';
        const userInitial = userName[0].toUpperCase();
        const avatarHtml = user.avatar_url
          ? '<img src="' + user.avatar_url + '" style="width:100%;height:100%;object-fit:cover;">'
          : userInitial;

        // Actions selon statut
        let actions = '';
        if (b.statut === 'en_attente') {
          actions = `
            <div style="display:flex; gap:6px; flex-shrink:0;">
              <button class="btn btn-danger btn-sm" onclick="refuser('${b.id}')">❌ Refuser</button>
              <button class="btn btn-success btn-sm" onclick="approuver('${b.id}')">✅ Approuver</button>
            </div>
          `;
        }

        return `
          <div class="admin-section" style="padding:14px 18px; margin-bottom:10px;">
            <div style="display:flex; align-items:center; gap:14px;">
              <img src="${img}" style="width:60px; height:60px; border-radius:10px; object-fit:cover; flex-shrink:0;" onerror="this.src='https://placehold.co/100x100/f5f3ee/2D2A26?text=K'">
              <div style="flex:1; min-width:0;">
                <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:4px;">
                  <div class="admin-row-title" style="font-size:14px;">${U().escapeHtml(listing.title || 'Annonce supprimée')}</div>
                  <span class="badge ${s.cls}">${s.txt}</span>
                </div>
                <div style="display:flex; align-items:center; gap:8px; margin-top:4px;">
                  <div style="width:24px; height:24px; border-radius:50%; background:#fbe8e2; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:#B8543D; overflow:hidden;">${avatarHtml}</div>
                  <div class="admin-row-sub">@${U().escapeHtml(user.username || '?')} · ${b.duree_jours}j · ${U().formatDate(b.created_at)}</div>
                </div>
                ${b.note_user ? '<div style="font-size:12px; color:#7A7A7A; font-style:italic; margin-top:4px;">💬 ' + U().escapeHtml(b.note_user) + '</div>' : ''}
                ${b.note_admin ? '<div style="font-size:12px; color:#7A7A7A; margin-top:4px;">⚙️ Admin : ' + U().escapeHtml(b.note_admin) + '</div>' : ''}
              </div>
              ${actions}
            </div>
          </div>
        `;
      }).join('');
    }

    $('filter-statut').addEventListener('change', async () => {
      $('loading').classList.remove('hidden');
      $('boosts-list').classList.add('hidden');
      await loadBoosts();
      $('loading').classList.add('hidden');
      $('boosts-list').classList.remove('hidden');
    });

    async function approuver(id) {
      const note = prompt('Note (optionnel) :', '');
      if (note === null) return;
      const { data, error } = await window.kwatta_db.rpc('approuver_boost', { p_request_id: id, p_note: note || null });
      if (error || (data && !data.success)) { alert('Erreur : ' + (error?.message || data?.error)); return; }
      alert('✅ Boost approuvé');
      await loadBoosts();
    }

    async function refuser(id) {
      const note = prompt('Raison du refus :', '');
      if (note === null) return;
      const { data, error } = await window.kwatta_db.rpc('refuser_boost', { p_request_id: id, p_note: note || null });
      if (error || (data && !data.success)) { alert('Erreur : ' + (error?.message || data?.error)); return; }
      alert('✅ Boost refusé');
      await loadBoosts();
    }

    window.approuver = approuver;
    window.refuser = refuser;
  </script>

</body>
</html>
