<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes offres — KWATTA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            terra: { 50:'#fdf5f2',100:'#fbe8e2',200:'#f5d0c5',300:'#ecad9b',400:'#d97a63',500:'#B8543D',600:'#a3442f',700:'#873727',800:'#6e2f23',900:'#5a2a20' },
            cream: '#FAF6F0',
            charcoal: '#2D2A26',
            honey: '#E8A96A',
          },
          fontFamily: {
            display: ['"Space Grotesk"', 'system-ui', 'sans-serif'],
            body: ['Inter', 'system-ui', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/theme-green.css">
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</head>
<body class="bg-cream text-charcoal font-body antialiased">

  <header class="sticky top-0 z-40 bg-white border-b border-charcoal/5">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center gap-3">
      <a href="index.html" class="w-9 h-9 rounded-lg hover:bg-charcoal/5 flex items-center justify-center">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
      </a>
      <h1 class="font-display font-bold text-lg">Mes offres</h1>
    </div>

    <!-- Onglets -->
    <div class="max-w-3xl mx-auto px-4 flex gap-1 border-t border-charcoal/5">
      <button class="offer-tab active" data-tab="recues">
        📥 Reçues
      </button>
      <button class="offer-tab" data-tab="envoyees">
        📤 Envoyées
      </button>
    <button id="lang-toggle" class="w-9 h-9 rounded-lg hover:bg-charcoal/5 flex items-center justify-center text-xs font-bold" title="FR / EN" onclick="if(window.kwattaToggleLang) window.kwattaToggleLang()">
        <span id="current-lang">EN</span>
      </button>
      </div>
    
  </header>

  <main class="max-w-3xl mx-auto px-4 py-6 pb-24">
    <div id="loading" class="text-center py-16">
      <div class="inline-block w-8 h-8 border-4 border-terra-500 border-t-transparent rounded-full animate-spin"></div>
    </div>

    <div id="offres-list" class="space-y-3"></div>

    <div id="empty-state" class="hidden text-center py-16">
      <div class="text-6xl mb-3">💬</div>
      <p class="text-charcoal/60">Aucune offre pour le moment</p>
    </div>
  </main>

  <!-- Modale contre-offre -->
  <div id="counter-modal" class="hidden fixed inset-0 z-[100] flex items-end sm:items-center justify-center p-0 sm:p-4" style="background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(4px);">
    <div class="bg-white rounded-t-3xl sm:rounded-2xl w-full sm:max-w-md">
      <div class="px-6 py-4 border-b border-charcoal/5 flex items-center justify-between">
        <h2 class="font-display font-bold">Contre-offre</h2>
        <button id="counter-close" class="w-8 h-8 rounded-lg hover:bg-charcoal/5 flex items-center justify-center">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="p-6 space-y-4">
        <div>
          <label class="block font-semibold mb-2">Montant proposé</label>
          <div class="relative">
            <input type="number" id="counter-amount" min="100" step="100"
              class="w-full px-4 py-4 pr-16 bg-cream border border-charcoal/10 rounded-xl text-xl font-bold text-center focus:border-terra-500 outline-none">
            <span class="absolute right-4 top-1/2 -translate-y-1/2 text-sm font-semibold text-charcoal/50">FCFA</span>
          </div>
        </div>

        <div>
          <label class="block font-semibold mb-2">Message (optionnel)</label>
          <textarea id="counter-message" rows="2" maxlength="300"
            class="w-full px-4 py-3 bg-cream border border-charcoal/10 rounded-xl text-sm focus:border-terra-500 outline-none resize-none"
            placeholder="Je ne peux pas descendre plus bas..."></textarea>
        </div>

        <button id="counter-submit"
          class="w-full py-3 rounded-xl bg-terra-500 hover:bg-terra-600 text-cream font-semibold transition">
          Envoyer la contre-offre
        </button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-init.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let currentUser = null;
    let currentTab = 'recues';
    let offres = [];
    let counterOffreId = null;

    function formatPrice(p) {
      return new Intl.NumberFormat('fr-FR').format(p) + ' FCFA';
    }

    function formatDate(d) {
      const date = new Date(d);
      const now = new Date();
      const diff = Math.floor((now - date) / 1000); // en secondes
      
      if (diff < 60) return 'à l\'instant';
      if (diff < 3600) return 'il y a ' + Math.floor(diff / 60) + ' min';
      if (diff < 86400) return 'il y a ' + Math.floor(diff / 3600) + 'h';
      return 'il y a ' + Math.floor(diff / 86400) + 'j';
    }

    // Styles des onglets
    const style = document.createElement('style');
    style.textContent = `
      .offer-tab {
        flex: 1;
        padding: 14px 16px;
        background: none;
        border: none;
        border-bottom: 2px solid transparent;
        font-size: 14px;
        font-weight: 500;
        color: #7A7A7A;
        cursor: pointer;
        transition: all 0.15s;
      }
      .offer-tab:hover { color: #2D2A26; }
      .offer-tab.active {
        color: #B8543D;
        border-bottom-color: #B8543D;
        font-weight: 600;
      }
      .statut-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 10px;
        border-radius: 9999px;
        font-size: 11px;
        font-weight: 700;
      }
      .statut-attente { background: #fef3c7; color: #92400e; }
      .statut-acceptee { background: #d1fae5; color: #065f46; }
      .statut-refusee { background: #fee2e2; color: #991b1b; }
      .statut-annulee { background: #e2e8f0; color: #475569; }
      .statut-expiree { background: #e2e8f0; color: #475569; }
    `;
    document.head.appendChild(style);

    // Init
    (async () => {
      const { data: { session } } = await window.kwatta_db.auth.getSession();
      if (!session) {
        window.location.href = 'login.html?redirect=' + encodeURIComponent(window.location.href);
        return;
      }
      currentUser = session.user;
      await loadOffres();
    })();

    // Charge les offres
    async function loadOffres() {
      $('loading').classList.remove('hidden');
      $('offres-list').innerHTML = '';
      $('empty-state').classList.add('hidden');

      const filter = currentTab === 'recues' ? 'id_vendeur' : 'id_acheteur';

      const { data, error } = await window.kwatta_db
        .from('v_offres_complet')
        .select('*')
        .eq(filter, currentUser.id)
        .order('created_at', { ascending: false });

      if (error) {
        console.error(error);
        $('loading').classList.add('hidden');
        return;
      }

      offres = data || [];
      $('loading').classList.add('hidden');

      if (offres.length === 0) {
        $('empty-state').classList.remove('hidden');
        return;
      }

      renderOffres();
    }

    // Affiche les offres
    function renderOffres() {
      const statutLabels = {
        'en_attente': { cls: 'statut-attente', txt: '⏳ En attente' },
        'acceptee': { cls: 'statut-acceptee', txt: '✓ Acceptée' },
        'refusee': { cls: 'statut-refusee', txt: '✗ Refusée' },
        'annulee': { cls: 'statut-annulee', txt: 'Annulée' },
        'expiree': { cls: 'statut-expiree', txt: 'Expirée' }
      };

      $('offres-list').innerHTML = offres.map(o => {
        const badge = statutLabels[o.statut] || statutLabels['en_attente'];
        const img = (o.listing_images && o.listing_images[0]) || 'https://placehold.co/100x100/f5f3ee/2D2A26?text=K';
        const isAcheteur = o.id_acheteur === currentUser.id;
        const contreOffre = o.contre_offre_montant ? 
          '<div class="text-xs mt-1 text-honey font-semibold">Contre-offre : ' + formatPrice(o.contre_offre_montant) + '</div>' : '';

        // Actions disponibles
        let actions = '';
        if (o.statut === 'en_attente') {
          if (!isAcheteur && !o.contre_offre_montant) {
            // Vendeur : accepter, refuser, contre-offrir
            actions = `
              <div class="flex gap-2 mt-3">
                <button onclick="traiter('${o.id}', 'refuser')" 
                  class="flex-1 py-2 rounded-lg bg-red-100 text-red-700 text-xs font-semibold hover:bg-red-200 transition">
                  Refuser
                </button>
                <button onclick="openCounter('${o.id}', ${o.montant_propose})" 
                  class="flex-1 py-2 rounded-lg bg-honey text-charcoal text-xs font-semibold hover:bg-yellow-500 transition">
                  Contre-offrir
                </button>
                <button onclick="traiter('${o.id}', 'accepter')" 
                  class="flex-1 py-2 rounded-lg bg-green-500 text-white text-xs font-semibold hover:bg-green-600 transition">
                  Accepter
                </button>
              </div>
            `;
          } else if (isAcheteur) {
            actions = `
              <div class="flex gap-2 mt-3">
                <button onclick="traiter('${o.id}', 'annuler')" 
                  class="flex-1 py-2 rounded-lg bg-charcoal/5 text-charcoal text-xs font-semibold hover:bg-charcoal/10 transition">
                  Annuler
                </button>
              </div>
            `;
          }
        }

        return `
          <div class="bg-white rounded-2xl p-4 border border-charcoal/5">
            <div class="flex items-start gap-3">
              <img src="${img}" class="w-16 h-16 rounded-lg object-cover bg-charcoal/5" onerror="this.src='https://placehold.co/100x100/f5f3ee/2D2A26?text=K'">
              <div class="flex-1 min-w-0">
                <div class="flex items-start justify-between gap-2">
                  <div class="min-w-0">
                    <a href="product.html?id=${o.id_listing}" class="font-semibold text-sm truncate hover:text-terra-500">${o.listing_titre}</a>
                    <div class="text-xs text-charcoal/50 mt-0.5">
                      ${isAcheteur ? 'Vendeur : ' + (o.vendeur_nom || o.vendeur_username) : 'Acheteur : ' + (o.acheteur_nom || o.acheteur_username)}
                    </div>
                    <div class="text-xs text-charcoal/40 mt-0.5">${formatDate(o.created_at)}</div>
                  </div>
                  <span class="statut-badge ${badge.cls}">${badge.txt}</span>
                </div>

                <div class="mt-2 flex items-baseline gap-3">
                  <div>
                    <div class="text-xs text-charcoal/50">Prix affiché</div>
                    <div class="text-sm font-semibold text-charcoal/60 line-through">${formatPrice(o.listing_prix)}</div>
                  </div>
                  <div>
                    <div class="text-xs text-charcoal/50">Offre</div>
                    <div class="text-lg font-bold text-terra-600">${formatPrice(o.montant_propose)}</div>
                  </div>
                </div>

                ${o.message ? '<div class="mt-2 text-xs text-charcoal/70 italic bg-cream p-2 rounded-lg">"' + o.message + '"</div>' : ''}
                ${contreOffre}

                ${actions}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Traiter une offre
    window.traiter = async (offreId, action) => {
      if (!confirm('Confirmer : ' + action + ' ?')) return;

      const { data, error } = await window.kwatta_db.rpc('traiter_offre', {
        p_offre_id: offreId,
        p_action: action
      });

      if (error) {
        alert('Erreur : ' + error.message);
        return;
      }

      if (data && !data.success) {
        alert('Erreur : ' + data.error);
        return;
      }

      alert('✅ ' + (data.message || 'Action effectuée'));
      await loadOffres();
    };

    // Ouvrir la modale de contre-offre
    window.openCounter = (offreId, montantPropose) => {
      counterOffreId = offreId;
      $('counter-amount').value = montantPropose;
      $('counter-message').value = '';
      $('counter-modal').classList.remove('hidden');
    };

    $('counter-close').addEventListener('click', () => {
      $('counter-modal').classList.add('hidden');
    });
    $('counter-modal').addEventListener('click', (e) => {
      if (e.target === $('counter-modal')) {
        $('counter-modal').classList.add('hidden');
      }
    });

    $('counter-submit').addEventListener('click', async () => {
      const montant = parseFloat($('counter-amount').value);
      const message = $('counter-message').value.trim();

      if (!montant || montant <= 0) {
        alert('Montant invalide');
        return;
      }

      const { data, error } = await window.kwatta_db.rpc('traiter_offre', {
        p_offre_id: counterOffreId,
        p_action: 'contre_offre',
        p_contre_offre: montant,
        p_message: message || null
      });

      if (error) {
        alert('Erreur : ' + error.message);
        return;
      }

      if (data && !data.success) {
        alert('Erreur : ' + data.error);
        return;
      }

      $('counter-modal').classList.add('hidden');
      alert('✅ Contre-offre envoyée');
      await loadOffres();
    });

    // Onglets
    document.querySelectorAll('.offer-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.offer-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentTab = tab.dataset.tab;
        loadOffres();
      });
    });
  </script>
  <script src="js/bottom-nav.js" defer></script>
  <script src="js/idle-logout.js" defer></script>

</body>
</html>
